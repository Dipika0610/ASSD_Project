<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>TaskBoard</h1>
      <p class="subtitle">A simple, lightweight task manager</p>
    </header>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        class="task-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      />
      <button type="submit" id="add-btn" class="btn btn-primary">Add Task</button>
    </form>

    <div class="stats-bar">
      <span id="task-count">0 tasks</span>
      <span id="completed-count">0 completed</span>
    </div>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <div id="empty-state" class="empty-state">
      <p>No tasks yet. Add one above to get started!</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
